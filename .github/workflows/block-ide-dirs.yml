name: Block IDE/Agent Config Directories (Reusable)

on:
  workflow_call: {}

permissions: read-all

jobs:
  block-ide-dirs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Reject .vscode and .claude directories
        run: |
          if git ls-files .vscode .claude | grep -q .; then
            echo "::error::Supply chain risk: .vscode/ or .claude/ files must not be committed"
            git ls-files .vscode .claude
            exit 1
          fi
